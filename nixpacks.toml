[phases.setup]
nixPkgs = ["php82", "php82Extensions.pdo", "php82Extensions.mbstring", "php82Extensions.tokenizer", "php82Extensions.xml", "php82Extensions.ctype", "php82Extensions.json", "php82Extensions.curl", "php82Extensions.fileinfo", "php82Extensions.openssl", "php82Extensions.zip", "nodejs"]

[phases.install]
cmds = ["composer install --ignore-platform-req=php --no-dev"]

[phases.build]
cmds = ["npm install", "npm run build"]

[start]
cmd = "php artisan serve --host=0.0.0.0 --port=$PORT"
